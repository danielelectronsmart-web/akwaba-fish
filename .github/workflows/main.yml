amily: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"927c745f-dad8-445e-b187-d3833e188e14\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d1b773b7-b55c-456b-8c27-2f1316750264\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"aa99b324-05ca-43a6-bad1-21d7c4d12db9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n<style>/* Akwaba Fish — thème « Aqua » : eau profonde, lagune, corail */\n:root{\n  --font:\"Manrope\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --bg:#eef5f7;--card:#ffffff;--surf:#f3f8fa;--soft:#f3f8fa;\n  --ink:#0b2733;--mut:#46606d;--line:#dbe8ec;--hair:#e8f0f3;--hov:#eaf4f7;\n  --acc:#0a93b8;--acc-2:#19c2a6;--acc-h:#08809f;--acc-p:#066d88;--acc-deep:#06708c;--acc-ink:#fff;--acc-soft:#e1f4f9;\n  --ok:#05704f;--ok-soft:#dcf5ec;--warn:#95580a;--warn-soft:#fdf0d8;--bad:#c42f35;--bad-soft:#fde8e8;\n  --deep1:#04202c;--deep2:#073a4d;--deep3:#0b5b70;\n  --r:20px;--r-sm:12px;\n  --sh:0 1px 2px rgba(7,48,64,.05),0 8px 24px -8px rgba(7,48,64,.10);\n  --sh-h:0 2px 4px rgba(7,48,64,.06),0 18px 40px -12px rgba(7,72,96,.22);\n  --glass:rgba(255,255,255,.72);\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=light]){\n  --bg:#041821;--ca